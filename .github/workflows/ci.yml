# Lint, type check, unit tests and build on every push and pull request; the webview tests run
# in headless Chromium from the Playwright image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-test:
    runs-on: ubuntu-latest
    # Same Playwright version as playwright-core in package.json.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:browser -- --chromium="$(ls -d /ms-playwright/chromium-*/chrome-linux64/chrome | tail -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test/browser/screenshots/
          retention-days: 7
